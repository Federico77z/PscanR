## Continuous integration for a Bioconductor package, mirroring the checks run
## by the Bioconductor Single Package Builder: R CMD check + BiocCheck on the
## current Bioconductor devel image. Adapted from the biocthis template.
name: check-bioc

on:
  push:
    branches: [main, master, devel]
  pull_request:
    branches: [main, master, devel]

jobs:
  check:
    runs-on: ubuntu-latest
    container: bioconductor/bioconductor_docker:devel
    name: ubuntu-bioc-devel
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v5

      # The workspace is bind-mounted from the runner host, where it belongs to
      # the runner user, while steps in the container run as root. libgit2 --
      # which gert, and through it BiocCheck's large-file check, is built on --
      # refuses to open a repository it sees as owned by someone else, and dies
      # on the very first check. actions/checkout does set this, but under a
      # temporary HOME that it reverts once the step ends.
      - name: Mark the workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Query dependencies
        run: |
          install.packages('remotes')
          saveRDS(remotes::dev_package_deps(dependencies = TRUE), '.deps.rds')
        shell: Rscript {0}

      - name: Cache R packages
        uses: actions/cache@v5
        with:
          path: /usr/local/lib/R/site-library
          key: ${{ runner.os }}-bioc-devel-${{ hashFiles('.deps.rds') }}
          restore-keys: ${{ runner.os }}-bioc-devel-

      - name: Install dependencies
        run: |
          remotes::install_deps(dependencies = TRUE, repos = BiocManager::repositories())
          # BiocCheck is a Bioconductor package, so it cannot come from
          # install_cran(): that only sees CRAN, warns "not available for this
          # version of R", and leaves the BiocCheck step to die on a missing
          # namespace. BiocManager::repositories() covers CRAN and Bioconductor
          # alike, so one call installs both.
          BiocManager::install(c('rcmdcheck', 'BiocCheck'), ask = FALSE, update = FALSE)
        shell: Rscript {0}

      - name: R CMD check
        run: |
          rcmdcheck::rcmdcheck(
            args = c('--no-manual', '--as-cran'),
            error_on = 'warning',
            check_dir = 'check')
        shell: Rscript {0}

      - name: BiocCheck
        run: |
          BiocCheck::BiocCheck(
            '.',
            `quit-with-status` = TRUE,
            `no-check-bioc-views` = FALSE)
        shell: Rscript {0}
